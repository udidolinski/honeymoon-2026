<!doctype html>
<!-- Telegram bot connectivity test -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= bumps when icons change. Favicon is a real generated vector
         icon (granite peak + sequoia + palm, matching the trip palette).
         The apple-touch-icon below is still the ORIGINAL template's PNG
         placeholder — iOS ignores SVG for home-screen icons and this repo
         can't generate raster art; swap that PNG for real art if you want
         a proper home-screen icon on iPhone. -->
    <link rel="icon" type="image/svg+xml" href="./icon-honeymoon.svg?v=1" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-placeholder-192.png?v=1" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-placeholder.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#BF6A32" />

    <!-- Installable web app: lets Android Chrome fire `beforeinstallprompt`
         and gives the saved-to-home-screen launcher a name + icon. -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS Safari: Apple ignores the manifest, so these meta tags are how
         we get a clean home-screen icon, a custom short label, and a
         standalone (chrome-less) launch experience. -->
    <link rel="apple-touch-icon" href="./icon-placeholder.png?v=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Honeymoon '26" />

    <title>USA Honeymoon 2026 — Udi &amp; Miriam</title>
    <meta
      name="description"
      content="26 days across the American West and Hawaii — national parks, Vegas, and island time. Our honeymoon itinerary, map, stays and tips."
    />

    <link rel="canonical" href="https://udidolinski.github.io/honeymoon-2026/" />

    <!-- Open Graph (WhatsApp, Facebook, iMessage, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="USA Honeymoon 2026" />
    <meta property="og:url" content="https://udidolinski.github.io/honeymoon-2026/" />
    <meta property="og:title" content="USA Honeymoon 2026 — Udi & Miriam" />
    <meta
      property="og:description"
      content="26 days across the American West and Hawaii — national parks, Vegas, and island time. Our honeymoon itinerary, map, stays and tips."
    />
    <!-- og:image intentionally omitted — no real trip photos are bundled yet.
         See public/images/README.md; add one here once you have a hero shot. -->
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X (also used as a fallback by some clients) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="USA Honeymoon 2026 — Udi & Miriam" />
    <meta
      name="twitter:description"
      content="26 days across the American West and Hawaii — national parks, Vegas, and island time. Our honeymoon itinerary, map, stays and tips."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
